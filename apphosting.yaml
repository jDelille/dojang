# Firebase App Hosting settings for Roster staging (project dojang-companion).
# Secret values live in Google Secret Manager; only their names are here.
# Odoo staging is synthetic demo data only.
#
# The URLs below assume the App Hosting backend is named "dojang".
# If you name it something else, change every https://dojang--... value.

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # --- Roster's own sign-in database (Neon Postgres, via Prisma) ---
  - variable: DATABASE_URL
    secret: roster-database-url

  # --- next-auth ---
  - variable: NEXTAUTH_URL
    value: https://dojang--dojang-companion.us-central1.hosted.app
  - variable: NEXTAUTH_SECRET
    secret: roster-nextauth-secret
  - variable: ENCRYPTION_KEY
    secret: roster-encryption-key
  - variable: NEXT_PUBLIC_APP_URL
    value: https://dojang--dojang-companion.us-central1.hosted.app
    availability: [ BUILD, RUNTIME ]

  # --- Odoo + Hub (staff use their own Odoo session through the Hub) ---
  - variable: ODOO_URL
    value: https://odoo-8-232-33-240.sslip.io
  - variable: ODOO_DB
    value: dojang_demo_staging
  - variable: DOJANG_HUB_SITE_ID
    value: "1"
  - variable: ODOO_API_KEY
    secret: roster-odoo-api-key

  # --- Kiosk + follow-ups gateway (same values as the Companion backend) ---
  - variable: DOJANG_INTEGRATION_MODE
    value: odoo-test
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "false"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_KIOSK_SOURCE
    value: odoo
    availability: [ BUILD, RUNTIME ]
  - variable: DOJANG_PUBLIC_ORIGIN
    value: https://dojang--dojang-companion.us-central1.hosted.app
  - variable: DOJANG_ODOO_URL
    value: https://odoo-8-232-33-240.sslip.io
  - variable: DOJANG_ODOO_DATABASE
    value: dojang_demo_staging
  - variable: DOJANG_HUB_ENABLED
    value: "true"
  - variable: NEXT_PUBLIC_DOJANG_KIOSK_ROSTER_GRID
    value: "true"
    availability: [ BUILD, RUNTIME ]

  # These secrets already exist in Secret Manager for the Companion backend.
  - variable: DOJANG_COOKIE_SECRET
    secret: dojang-cookie-secret
  - variable: DOJANG_KIOSK_TOKEN
    secret: dojang-kiosk-token
  - variable: DOJANG_KIOSK_GATEWAY_KEY
    secret: dojang-kiosk-gateway-key
  - variable: DOJANG_STAFF_GATEWAY_KEY
    secret: dojang-staff-gateway-key
  - variable: DOJANG_KIOSK_PAIR_KEY
    secret: dojang-kiosk-pair-key
